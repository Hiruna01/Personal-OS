project_id = "personal-os"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
max_rows = 1000
[db]
port = 54322
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[studio]
enabled = true
port = 54323
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm", "http://localhost:3000/auth/recovery"]
enable_signup = false
minimum_password_length = 12
[auth.email]
enable_signup = false
enable_confirmations = true
[storage]
enabled = true
file_size_limit = "2MiB"
